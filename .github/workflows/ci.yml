name: CI

on:
  pull_request:
  push:
    branches: [master, 'release/**']
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      # Full Chromium only: the tests run it with channel 'chromium', so the headless shell isn't needed
      - run: npx playwright install --with-deps --no-shell chromium

      - run: npm run test:e2e

      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
